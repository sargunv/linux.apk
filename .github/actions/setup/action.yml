name: Innkeeper runner
description: Toolchains and prerequisites for hosted Linux runners
inputs:
  mode:
    description:
      build (compile and unit-test sources) or runtime (run the stage)
    required: true
runs:
  using: composite
  steps:
    - name: Runner packages and kernel setup
      shell: bash
      run: tools/ci/setup.sh '${{ inputs.mode }}'
    - uses: jdx/mise-action@v5
      with:
        cache: true
    - uses: actions/cache/restore@v4
      if: inputs.mode == 'build'
      id: sdk
      with:
        path: ~/Android/Sdk
        key:
          sdk-v2-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('tools/build/toolchain.env') }}
    - name: Android SDK
      if: inputs.mode == 'build'
      shell: bash
      run: |
        source tools/build/toolchain.env
        sdk="$HOME/Android/Sdk"
        if [[ '${{ steps.sdk.outputs.cache-hit }}' != true ]]; then
          mkdir -p "$sdk"
          cp -a "$ANDROID_HOME/licenses" "$sdk/"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "ndk;$ANDROID_NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-$ANDROID_COMPILE_SDK.0" "platform-tools"
        fi
        echo "ANDROID_HOME=$sdk" >>"$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >>"$GITHUB_ENV"
    - uses: actions/cache/save@v4
      if:
        steps.sdk.outcome == 'success' && steps.sdk.outputs.cache-hit != 'true'
      with:
        path: ~/Android/Sdk
        key: ${{ steps.sdk.outputs.cache-primary-key }}
    - uses: actions/cache@v4
      # Runtime jobs don't compile, and a bundle fills out/ with more files
      # than hashFiles can walk.
      if: inputs.mode == 'build'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          out/cargo
          ~/.cache/ccache
        key:
          compile-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
          hashFiles('mise.lock', 'Cargo.lock', 'tools/build/toolchain.env')
          }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', '.cargo/**', '**/*.c',
          '**/*.cpp', '**/*.h', '**/CMakeLists.txt', 'CMakePresets.json') }}
        restore-keys: |
          compile-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock', 'Cargo.lock', 'tools/build/toolchain.env') }}-
    - uses: actions/cache@v4
      if: inputs.mode == 'build'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          out/build/system-app
        key:
          gradle-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
          hashFiles('mise.lock', 'tools/build/toolchain.env',
          'android/system-app/**', 'host/bridge/src/ipc/wire-fixtures.txt',
          'host/bridge/src/a11y/snapshot-fixture.txt') }}
        restore-keys: |
          gradle-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
