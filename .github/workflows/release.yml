name: Release

on:
  # After CI succeeds on a push to main. Packaging that commit here, instead
  # of building alongside CI, avoids a second full build and a snapshot of a
  # commit CI rejected. The workflow file on main is what runs.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the Flatpak bundle without publishing it
        type: boolean
        default: true

# contents: write creates the GitHub Release and moves the snapshot tag.
permissions:
  contents: write

concurrency:
  group:
    ${{ github.event_name == 'workflow_run' && 'snapshot' ||
    format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  build:
    # A snapshot packages the stage CI already saved. A tag or a manual run
    # has no such run, so it builds.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/stage

  package:
    needs: build
    # A skipped build is the snapshot path. A failed CI run, or a CI run that
    # was not a push, does not publish.
    if: |
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run's github.sha is main's tip, not the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/stage
        with:
          restore-only: true
      - uses: ./.github/actions/setup
        with:
          mode: runtime
      - name: Build the bundle
        env:
          INNKEEPER_RELEASE_VERSION:
            ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          packaging/flatpak/release.sh '${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'stable' || 'snapshot' }}'
      - name: Publish the snapshot bundle
        if:
          github.event_name == 'workflow_run' || (github.event_name ==
          'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-snapshot.flatpak)
          name=${bundle##*/}
          built=$(date -u +%Y-%m-%dT%H:%MZ)
          notes="Snapshot of $(git rev-parse HEAD), built ${built}."
          notes="${notes}"$'\n\n```sh\n'"flatpak install --user ./${name}"$'\n```\n\n'
          notes="${notes}A newer snapshot is a reinstall of the new file."
          # One floating release. Move the tag onto this commit, then replace
          # the asset and drop any other (a renamed app id leaves the old bundle).
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/tags/snapshot"
          if gh release view snapshot >/dev/null 2>&1; then
            gh release edit snapshot --prerelease --title snapshot --notes "$notes"
          else
            gh release create snapshot --prerelease --title snapshot --notes "$notes"
          fi
          gh release upload snapshot "$bundle" --clobber
          # --clobber only replaces an asset with the same name.
          gh release view snapshot --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [[ -n $asset && $asset != "$name" ]] || continue
              gh release delete-asset snapshot "$asset" --yes
            done
      - name: Publish the stable bundle
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=$(echo out/release/*-stable.flatpak)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
