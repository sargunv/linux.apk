# Compat corpus: pinned F-Droid APKs (see tests/compat/README.md).
#
# `mise run test:compat -- fetch` downloads each APK into out/test/compat/corpus/
# and checks its SHA-256; the APKs are never committed. To bump an app, copy
# the new version code, URL and SHA-256 from
# https://f-droid.org/repo/index-v2.json. Prefer x86_64 or universal APKs
# (`native` lists the ABIs the APK ships).
#
# Per app: framework = the UI framework or engine the APK is built with
# (identified by hand from its libs and assets, see tests/compat/README.md).
# The harness reads neither `framework` nor `native`; they help pick apps.
#
# Per app, optional:
#   settle = <seconds>  wait after launch before the first-frame check (default 8)
#   script = [...]      scripted check, run after the first frame:
#                       "tap:<text>"    tap the node whose text or content-desc
#                                       is <text> (uiautomator dump)
#                       "try:<text>"    tap it if it's there (optional prompts)
#                       "expect:<text>" a node's text or content-desc contains it
#                       "absent:<text>" no node's text or content-desc contains it
#                       "key:<keycode>" "wait:<seconds>"
#                       "sh:<command>"  shell command in the session, must exit 0
#                       "intent:<uri>"  VIEW <uri> in the app
#                       "bridgelog:<text>" the host bridge logged <text> since
#                                       the script started (links compat only logs)
#                       "audio:"       non-silent PCM on the private session sink
#                       "gesture:<pinch|pan|doubletap> X Y"  multi-touch via
#                                       Innkeeper System's input bridge
#                       "shot:<name>"   screenshot, must not be blank
#                       "changed:<name>" ditto, and must differ from the last
#                                       shot (did the gesture do anything?)
#   note = "..."        why the app is in the corpus
#   manual = "..."      what to verify by hand later (not automated)

